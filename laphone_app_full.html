<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#080808">
<title>La Phone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --black:#080808;--surface:#0F0F0F;--surface2:#161616;--surface3:#1C1C1C;
  --border:#222;--border2:#2C2C2C;--white:#F0F0F0;--gray:#777;--gray2:#444;
  --accent:#C8F135;--accent2:#A8D010;--green:#22C55E;--green-dim:#22C55E20;
  --blue:#3B82F6;--blue-dim:#3B82F620;--red:#EF4444;--red-dim:#EF444420;
  --orange:#F97316;--purple:#A855F7;--gold:#F59E0B;--purple-dim:#A855F720;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html,body{height:100%;background:var(--black);}
body{color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;}

/* CLOUD STATUS BAR */
.cloud-status{position:fixed;top:0;left:0;right:0;z-index:2000;padding:6px;text-align:center;font-size:11px;font-weight:600;transform:translateY(-100%);transition:transform 0.3s;}
.cloud-status.show{transform:translateY(0);}
.cloud-status.offline{background:var(--orange);color:#000;}
.cloud-status.online{background:var(--green);color:#000;}
.cloud-status.syncing{background:var(--blue);color:#fff;}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--black);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;overflow-y:auto;}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(200,241,53,0.1) 0%,transparent 60%);pointer-events:none;}
.login-logo{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:800;letter-spacing:-3px;margin-bottom:6px;position:relative;}
.login-logo span{color:var(--accent);}
.login-tag{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:3px;margin-bottom:40px;position:relative;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:26px;width:100%;max-width:380px;position:relative;}
.login-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:6px;text-align:center;}
.login-sub{font-size:13px;color:var(--gray);text-align:center;margin-bottom:22px;}
.login-field{margin-bottom:14px;}
.login-label{font-size:12px;color:var(--gray);margin-bottom:7px;display:block;}
.login-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;color:var(--white);font-size:15px;outline:none;}
.login-input:focus{border-color:var(--accent);}
.login-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;color:var(--white);font-size:15px;outline:none;-webkit-appearance:none;}
.login-select:focus{border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:#000;border:none;border-radius:13px;padding:16px;font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;margin-top:6px;}
.login-btn:active{transform:scale(0.98);}
.login-err{background:var(--red-dim);color:var(--red);border-radius:10px;padding:12px;font-size:13px;text-align:center;margin-bottom:14px;display:none;}
.login-err.show{display:block;}
.login-hint{font-size:11px;color:var(--gray2);text-align:center;margin-top:16px;line-height:1.6;}

/* APP */
.app{display:none;flex-direction:column;height:100vh;height:100dvh;}
.app.active{display:flex;}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + var(--safe-top)) 18px 10px;flex-shrink:0;background:var(--black);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:800;letter-spacing:-0.5px;}
.nav-logo span{color:var(--accent);}
.nav-sub{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:2px;margin-top:1px;}
.nav-user{display:flex;align-items:center;gap:8px;}
.nav-badge{border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;}
.nav-badge.admin{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;}
.nav-badge.seller{background:var(--blue-dim);color:var(--blue);}
.nav-logout{font-size:18px;cursor:pointer;padding:4px 6px;color:var(--gray);}

.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--black);overflow-x:auto;}
.tab{padding:13px 14px;font-size:13px;font-weight:600;color:var(--gray);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px calc(20px + var(--safe-bottom));}

.section-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:2px;margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
.section-label:first-child{margin-top:2px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

.hero-stat{background:linear-gradient(135deg,#0D1A0D,#0D0D1A);border:1px solid #1A2A1A;border-radius:20px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;}
.hero-stat::before{content:'₸';position:absolute;right:-10px;top:-25px;font-size:130px;font-family:'Space Grotesk',sans-serif;font-weight:800;color:#0D2A0D;line-height:1;pointer-events:none;}
.hs-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;position:relative;}
.hs-value{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:800;color:var(--accent);letter-spacing:-2px;line-height:1;margin-bottom:6px;position:relative;}
.hs-change{font-size:13px;color:var(--green);position:relative;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;}
.stat-card-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.stat-card-val{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:800;line-height:1;}
.stat-card-val.accent{color:var(--accent);}.stat-card-val.green{color:var(--green);}
.stat-card-val.blue{color:var(--blue);}.stat-card-val.white{color:var(--white);}
.stat-card-sub{font-size:10px;color:var(--gray2);margin-top:4px;}

.payment-breakdown{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.pay-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;border-left:3px solid transparent;}
.pay-card.cash{border-left-color:var(--green);}.pay-card.online{border-left-color:var(--blue);}.pay-card.installment{border-left-color:var(--purple);}
.pay-icon{font-size:26px;flex-shrink:0;}.pay-info{flex:1;}
.pay-label{font-size:12px;color:var(--gray);margin-bottom:4px;}
.pay-val{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:800;letter-spacing:-1px;line-height:1;}
.pay-card.cash .pay-val{color:var(--green);}.pay-card.online .pay-val{color:var(--blue);}.pay-card.installment .pay-val{color:var(--purple);}
.pay-sub{font-size:10px;color:var(--gray2);margin-top:4px;}

.point-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer;}
.point-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.point-card.p1::before{background:var(--accent);}.point-card.p2::before{background:var(--blue);}.point-card.p3::before{background:var(--purple);}
.point-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.point-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;margin-bottom:3px;}
.point-seller{font-size:11px;color:var(--gray);display:flex;align-items:center;gap:5px;}
.point-seller-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.point-revenue{text-align:right;}
.point-revenue-val{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;color:var(--accent);}
.point-revenue-label{font-size:9px;color:var(--gray);}
.point-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pm{background:var(--surface2);border-radius:9px;padding:8px;text-align:center;}
.pm-val{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;}
.pm-val.green{color:var(--green);}.pm-val.accent{color:var(--accent);}
.pm-label{font-size:9px;color:var(--gray);margin-top:2px;}
.point-progress{margin-top:12px;}
.pp-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.pp-fill{height:100%;border-radius:3px;}
.pp-info{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);margin-top:5px;}

.rank-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:9px;}
.rank-medal{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;flex-shrink:0;}
.rank-1{background:linear-gradient(135deg,#F59E0B,#FCD34D);color:#000;}
.rank-2{background:linear-gradient(135deg,#9CA3AF,#D1D5DB);color:#000;}
.rank-3{background:linear-gradient(135deg,#B45309,#D97706);color:#fff;}
.rank-other{background:var(--surface2);color:var(--gray);}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.rank-point{font-size:11px;color:var(--gray);}
.rank-revenue{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--accent);text-align:right;}
.rank-count{font-size:10px;color:var(--gray);margin-top:2px;text-align:right;}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
.chart-title{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:16px;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:130px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar{width:100%;border-radius:5px 5px 0 0;min-height:6px;}
.bar-val{font-size:9px;color:var(--gray);font-family:'Space Grotesk',sans-serif;font-weight:600;}
.bar-label{font-size:10px;color:var(--gray);text-align:center;}
.compare-row{display:flex;align-items:center;gap:12px;padding:10px 0;}
.compare-name{width:80px;flex-shrink:0;font-size:12px;font-weight:600;}
.compare-bar-track{flex:1;height:24px;background:var(--surface2);border-radius:6px;overflow:hidden;}
.compare-bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#000;min-width:fit-content;white-space:nowrap;}

.scan-big{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:18px;padding:20px;width:100%;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
.scan-big-icon{font-size:24px;}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.qa{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;}
.qa-icon{font-size:24px;margin-bottom:6px;}
.qa-label{font-size:12px;font-weight:600;}

.search-bar{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.search-bar input{flex:1;background:none;border:none;color:var(--white);font-size:14px;outline:none;}
.filter-pills{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;white-space:nowrap;cursor:pointer;color:var(--gray);}
.pill.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
.prod-item{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;}
.prod-thumb{width:44px;height:44px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.prod-info{flex:1;min-width:0;}
.prod-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-meta{font-size:11px;color:var(--gray);}
.prod-point{font-size:10px;color:var(--gray2);margin-top:2px;}
.prod-right{text-align:right;flex-shrink:0;}
.prod-price{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--accent);}
.prod-stock{font-size:10px;margin-top:3px;padding:2px 7px;border-radius:20px;display:inline-block;}
.in{background:#22C55E22;color:var(--green);}.out{background:#EF444422;color:var(--red);}
.mine{background:var(--accent);color:#000;font-weight:700;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px calc(28px + var(--safe-bottom));width:100%;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:8px auto 16px;}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--gray);margin-bottom:18px;}
.detail-rows{display:flex;flex-direction:column;}
.detail-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-key{font-size:13px;color:var(--gray);}
.detail-val{font-size:13px;font-weight:600;font-family:'Space Grotesk',sans-serif;}
.detail-val.green{color:var(--green);}.detail-val.accent{color:var(--accent);}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:12px;color:var(--gray);margin-bottom:7px;}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:13px;color:var(--white);font-size:15px;outline:none;}
.modal-input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.modal-btn{flex:1;min-width:100px;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
.modal-btn.primary{background:var(--accent);color:#000;}
.modal-btn.secondary{background:var(--surface2);color:var(--white);border:1px solid var(--border2);}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#000;padding:13px 22px;border-radius:30px;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;z-index:200;transition:transform 0.3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:90%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red);color:#fff;}
.empty{text-align:center;padding:40px 20px;color:var(--gray2);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-text{font-size:14px;line-height:1.5;}

/* SCANNER */
.scanner-wrap{background:#000;border-radius:18px;overflow:hidden;position:relative;margin-bottom:14px;border:1px solid var(--border2);}
#reader{width:100%;}
#reader video{width:100%!important;border-radius:18px;display:block;}
.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:5;}
.scan-frame{width:80%;height:90px;border:2px solid var(--accent);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,0.4);position:relative;}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:24px;height:24px;border-color:var(--accent);border-style:solid;}
.scan-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:8px 0 0 0;}
.scan-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 8px 0;}
.scan-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:scanmove 2s linear infinite;}
@keyframes scanmove{0%{top:5%;}50%{top:95%;}100%{top:5%;}}
.scan-mode-tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:12px;}
.smt{flex:1;text-align:center;padding:10px;font-size:12px;font-weight:600;color:var(--gray);border-radius:8px;cursor:pointer;}
.smt.active{background:var(--accent);color:#000;font-weight:700;}
.scan-hint{text-align:center;font-size:13px;color:var(--gray);margin-bottom:12px;line-height:1.5;}
.scan-result-box{background:#0D1A0D;border:1px solid #1A3A1A;border-radius:14px;padding:16px;margin-bottom:12px;animation:fade 0.3s;}
.srb-label{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.srb-imei{font-family:'Space Grotesk',monospace;font-size:22px;font-weight:700;color:var(--accent);letter-spacing:1px;word-break:break-all;}
.ocr-status{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13px;color:var(--gray);}
.ocr-spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* INTAKE FORM */
.intake-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.intake-imei-display{background:#0D1A0D;border:1px solid #1A3A1A;border-radius:12px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.intake-imei-display .ii-icon{font-size:24px;}
.intake-imei-display .ii-label{font-size:10px;color:var(--gray);text-transform:uppercase;}
.intake-imei-display .ii-val{font-family:'Space Grotesk',monospace;font-size:16px;font-weight:700;color:var(--accent);}
.form-group{margin-bottom:13px;}
.form-label{display:block;font-size:12px;color:var(--gray);margin-bottom:7px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:13px;color:var(--white);font-size:15px;outline:none;-webkit-appearance:none;font-family:'Inter',sans-serif;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{resize:none;height:70px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.battery-display{display:flex;align-items:center;gap:12px;margin-top:6px;}
.battery-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;color:var(--accent);min-width:62px;}
input[type=range]{-webkit-appearance:none;flex:1;height:6px;background:var(--border2);border-radius:3px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:var(--accent);border-radius:50%;cursor:pointer;}
.cond-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.cond-pill{padding:9px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--gray);font-size:12px;font-weight:600;cursor:pointer;}
.cond-pill.active{background:var(--accent);color:#000;border-color:var(--accent);}
.photo-row{display:flex;gap:8px;margin-top:8px;}
.photo-btn{flex:1;background:var(--surface2);border:1px dashed var(--border2);border-radius:11px;padding:16px;text-align:center;cursor:pointer;}
.photo-btn input{display:none;}
.photo-icon{font-size:22px;margin-bottom:4px;}
.photo-label{font-size:11px;color:var(--gray);}

async function loadSettingsFromCloud(){
  if(!cloudMode || !sb) return;
  try{
    const {data} = await sb.from('settings').select('*').eq('id','main').maybeSingle();
    if(data){
      if(data.users) USERS = data.users;
      if(data.points) POINTS = data.points;
      localStorage.setItem('lp_users',JSON.stringify(USERS));
      localStorage.setItem('lp_points',JSON.stringify(POINTS));
    } else {
      // Таблица пустая или нет записи — сохраняем дефолтные настройки
      await sb.from('settings').upsert({id:'main', users:USERS, points:POINTS});
    }
  }catch(e){
    // Таблица settings ещё не создана — это нормально при первом запуске
    console.log('settings not ready yet:', e.message);
  }
}

let sb = null; window._sb = null;
let cloudMode = false;
let currentUser = null;
let DB = {products:[], sales:[]};

// ==================== ОБЛАКО ====================
async function initCloud(){
  if(SUPABASE_URL && SUPABASE_KEY && window.supabase){
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); window._sb = sb;
      cloudMode = true;
      showCloud('online','☁️ Облако подключено');
      return true;
    }catch(e){
      cloudMode = false;
      showCloud('offline','📴 Работа локально');
      return false;
    }
  }
  cloudMode = false;
  return false;
}

function showCloud(type, msg){
  const el = document.getElementById('cloud-status');
  el.className = 'cloud-status show '+type;
  el.textContent = msg;
  setTimeout(()=>el.classList.remove('show'), 3000);
}

function loadDBSync(){
  // Всегда работает мгновенно — берёт из localStorage или дефолтные
  DB.products = JSON.parse(localStorage.getItem('lp_products')||'null') || defaultProducts();
  DB.sales = JSON.parse(localStorage.getItem('lp_sales')||'null') || defaultSales();
  saveLocal();
  // Если облако подключено — подтянем свежие данные в фоне
  if(cloudMode && sb){ loadFromCloud(); }
}

async function loadFromCloud(){
  try{
    const {data:products} = await sb.from('products').select('*');
    const {data:sales} = await sb.from('sales').select('*');
    if(products){ DB.products = products; }
    if(sales){ DB.sales = sales; }
    await loadSettingsFromCloud();
  }catch(e){ console.log('cloud load error',e); }
}

async function loadDB(){
  loadDBSync();
}

function defaultProducts(){ return []; }
function defaultSales(){ return []; }


async function seedCloud(){
  const products = defaultProducts();
  const sales = defaultSales();
  await sb.from('products').insert(products);
  await sb.from('sales').insert(sales);
  DB.products = products;
  DB.sales = sales;
}

function saveLocal(){
  try{
    // Фото/видео не храним в localStorage (переполнят лимит 5-10МБ) — только в облаке
    const lightProducts=DB.products.map(p=>{
      const {photos,video,...rest}=p;
      return {...rest, hasPhotos:!!(photos&&photos.length), photos:undefined, video:undefined};
    });
    localStorage.setItem('lp_products',JSON.stringify(lightProducts));
    localStorage.setItem('lp_sales',JSON.stringify(DB.sales));
  }catch(e){
    // Переполнение — чистим и сохраняем только продажи
    try{localStorage.setItem('lp_sales',JSON.stringify(DB.sales));}catch(_){}
    if(typeof showToast==='function')showToast('⚠️ Память заполнена — подключи облако',true);
  }
}

async function cloudSell(product, payment){
  product.sold = true;
  const sale = {
    id:'S'+Date.now(),
    point:currentUser.point||product.point,
    seller:currentUser.name,
    model:product.model+' '+product.storage,
    sell_price:product.sell_price,
    buy_price:product.buy_price,
    payment,
    created_at:new Date().toISOString()
  };
  DB.sales.push(sale);
  if(cloudMode && sb){
    showCloud('syncing','🔄 Сохранение...');
    try{
      await sb.from('products').update({sold:true}).eq('id',product.id);
      await sb.from('sales').insert([sale]);
      showCloud('online','☁️ Сохранено в облако');
    }catch(e){ showCloud('offline','📴 Сохранено локально'); }
  } else {
    saveLocal();
  }
}

function adminOverview(){
  if(cloudMode&&sb){loadFromCloud();}
  const s=DB.sales.filter(x=>!x.returned);

  const profit=s.reduce((a,b)=>a+(b.sell_price-b.buy_price),0);
  const stock=DB.products.filter(p=>!p.sold);
  const cash=s.filter(x=>x.payment==='Наличные');
  const online=s.filter(x=>x.payment==='Kaspi');
  const inst=s.filter(x=>x.payment==='Рассрочка');
  document.getElementById('main').innerHTML=`
    <div class="hero-stat"><div class="hs-label">Выручка всей сети · сегодня</div><div class="hs-value">${fmt(rev)}</div><div class="hs-change">↑ ${s.length} продаж по 3 точкам</div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-card-label">Чистая прибыль</div><div class="stat-card-val green">+${fmt(profit)}</div></div>
      <div class="stat-card"><div class="stat-card-label">Средний чек</div><div class="stat-card-val accent">${fmt(s.length?Math.round(rev/s.length):0)}</div></div>
      <div class="stat-card"><div class="stat-card-label">Телефонов</div><div class="stat-card-val white">${stock.length}</div></div>
      <div class="stat-card"><div class="stat-card-label">Стоимость склада</div><div class="stat-card-val blue">${fmt(stock.reduce((a,p)=>a+p.buy_price,0))}</div></div>
    </div>
    <div class="section-label">💵 Разбивка по оплатам</div>
    <div class="payment-breakdown">
      <div class="pay-card cash"><div class="pay-icon">💵</div><div class="pay-info"><div class="pay-label">Наличными в кассах</div><div class="pay-val">${fmt(cash.reduce((a,b)=>a+b.sell_price,0))}</div><div class="pay-sub">${cash.length} продаж · контроль</div></div></div>
      <div class="pay-card online"><div class="pay-icon">📱</div><div class="pay-info"><div class="pay-label">Онлайн Kaspi</div><div class="pay-val">${fmt(online.reduce((a,b)=>a+b.sell_price,0))}</div><div class="pay-sub">${online.length} продаж</div></div></div>
      <div class="pay-card installment"><div class="pay-icon">📅</div><div class="pay-info"><div class="pay-label">Рассрочка</div><div class="pay-val">${fmt(inst.reduce((a,b)=>a+b.sell_price,0))}</div><div class="pay-sub">${inst.length} продаж</div></div></div>
    </div>
    <div class="chart-card"><div class="chart-title">Выручка по точкам</div><div class="bar-chart" id="ov-chart"></div></div>
    ${DB.sales.filter(x=>x.returned).length?`<div class="section-label">↩️ Возвраты сегодня</div><div class="stat-card" style="border-left:3px solid var(--red);"><div class="stat-card-label">Возвращено телефонов</div><div class="stat-card-val" style="color:var(--red);">${DB.sales.filter(x=>x.returned).length} шт · −${fmt(DB.sales.filter(x=>x.returned).reduce((a,b)=>a+b.sell_price,0))}</div></div>`:''}`;
  const bp=POINTS.map(p=>({name:p.name.split('·')[0].trim(),cls:p.cls,rev:s.filter(x=>x.point===p.id).reduce((a,b)=>a+b.sell_price,0)}));

function adminAnalytics(){if(cloudMode&&sb){loadFromCloud();}
  const s=DB.sales.filter(x=>!x.returned);
  // Топ моделей по продажам
  const byModel={};
  s.forEach(x=>{const key=x.model.replace(/\s+(128GB|256GB|512GB|64GB|1TB)/g,'').trim();if(!byModel[key])byModel[key]={count:0,revenue:0,profit:0};byModel[key].count++;byModel[key].revenue+=x.sell_price;byModel[key].profit+=(x.sell_price-x.buy_price);});
  const topModels=Object.entries(byModel).sort((a,b)=>b[1].count-a[1].count).slice(0,5);
  const profitModels=Object.entries(byModel).sort((a,b)=>b[1].profit-a[1].profit).slice(0,5);
  // По брендам — определяем из названия модели
  const detectBrand=(m)=>{const ml=(m||'').toLowerCase();if(ml.includes('iphone')||ml.includes('airpods')||ml.includes('apple'))return 'Apple';if(ml.includes('samsung')||ml.includes('galaxy'))return 'Samsung';if(ml.includes('xiaomi')||ml.includes('redmi')||ml.includes('poco'))return 'Xiaomi';if(ml.includes('honor'))return 'Honor';if(ml.includes('vivo'))return 'Vivo';if(ml.includes('oppo'))return 'Oppo';if(ml.includes('pixel'))return 'Google';return 'Другое';};
  const byBrand={};
  DB.products.forEach(p=>{const b=p.brand&&p.brand!=='Другое'&&p.brand!=='Trade-in'?p.brand:detectBrand(p.model);if(!byBrand[b])byBrand[b]={count:0};byBrand[b].count++;});
  const co={p1:'var(--accent)',p2:'var(--blue)',p3:'var(--purple)'};
  document.getElementById('main').innerHTML=`
    <div class="section-label" style="margin-top:2px;">🔥 Самые продаваемые модели</div>
    ${topModels.length?topModels.map((m,i)=>`
      <div class="rank-item"><div class="rank-medal ${['rank-1','rank-2','rank-3'][i]||'rank-other'}">${i+1}</div>
      <div class="rank-info"><div class="rank-name">${m[0]}</div><div class="rank-point">${m[1].count} продаж</div></div>
      <div><div class="rank-revenue">${fmt(m[1].revenue)}</div><div class="rank-count">оборот</div></div></div>`).join(''):'<div class="empty"><div class="empty-text">Пока нет данных</div></div>'}

    <div class="section-label">💎 Самые прибыльные модели</div>
    ${profitModels.length?profitModels.map((m,i)=>`
      <div class="rank-item"><div class="rank-medal ${['rank-1','rank-2','rank-3'][i]||'rank-other'}">${i+1}</div>
      <div class="rank-info"><div class="rank-name">${m[0]}</div><div class="rank-point">маржа ${m[1].count} шт</div></div>
      <div><div class="rank-revenue" style="color:var(--green);">+${fmt(m[1].profit)}</div><div class="rank-count">прибыль</div></div></div>`).join(''):'<div class="empty"><div class="empty-text">Пока нет данных</div></div>'}

    <div class="section-label">📦 Склад по брендам</div>
    <div class="chart-card">
      ${Object.entries(byBrand).map(([b,d])=>{const max=Math.max(...Object.values(byBrand).map(x=>x.count),1);return `<div class="compare-row"><div class="compare-name">${b}</div><div class="compare-bar-track"><div class="compare-bar-fill" style="width:${Math.max(d.count/max*100,18)}%;background:var(--accent);">${d.count} шт</div></div></div>`;}).join('')}
    </div>

    <div class="section-label">📅 Продажи по дням недели</div>
    <div class="chart-card"><div class="bar-chart" id="days-chart"></div></div>
  `;
  // График дней (демо данные распределим)
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  // Реальные продажи по дням недели из дат
  const dayData=[0,0,0,0,0,0,0];
  s.forEach(sale=>{
    const d=new Date(sale.created_at);
    const wd=(d.getDay()+6)%7; // Пн=0 ... Вс=6
    dayData[wd]++;
  });
  const max=Math.max(...dayData,1);
  document.getElementById('days-chart').innerHTML=dayData.map((v,i)=>`<div class="bar-col"><div class="bar-val">${v}</div><div class="bar" style="height:${v/max*100}%;background:var(--accent);"></div><div class="bar-label">${days[i]}</div></div>`).join('');
}

function getClients(){
  // Собираем клиентов из продаж
  const clients={};
  DB.sales.filter(x=>!x.returned).forEach(s=>{
    if(!s.client_name||s.client_name==='—')return;
    const key=s.client_phone||s.client_name;
    if(!clients[key])clients[key]={name:s.client_name,phone:s.client_phone||'',purchases:0,total:0,items:[],lastDate:s.created_at};
    clients[key].purchases++;
    clients[key].total+=s.sell_price;
    clients[key].items.push({model:s.model,price:s.sell_price,imei:s.imei,date:s.created_at,warranty:s.warranty_days});
    if(s.created_at>clients[key].lastDate)clients[key].lastDate=s.created_at;
  });
  return Object.values(clients).sort((a,b)=>b.total-a.total);
}

function saveAllSettings(){

  USERS.owner.pass=document.getElementById('set-owner-pass').value.trim()||'admin';
  ['daniyar','aigerim','erlan'].forEach(k=>{
    const u=USERS[k];
    const newName=document.getElementById('set-'+k+'-name').value.trim();
    const newPass=document.getElementById('set-'+k+'-pass').value.trim();
    const newPoint=document.getElementById('set-'+k+'-point').value.trim();
    if(newName){
      const oldName=u.name;
      u.name=newName;
      // Обновим имя в точке и в продажах
      const pt=POINTS.find(p=>p.id===u.point);
      if(pt){pt.seller=newName;if(newPoint)pt.name=newPoint;}
      DB.sales.forEach(s=>{if(s.seller===oldName)s.seller=newName;});
    }
    if(newPass)u.pass=newPass;
  });
  saveSettings();
  saveLocal();
  showToast('✅ Настройки сохранены');
  if(navigator.vibrate)navigator.vibrate(50);
}

// ==================== ПРИЁМКА + СКАНЕР ====================
let scannedIMEI='';let intakePhotos=[];let intakeCondition='Отличное';
let html5Scanner=null;let scanMode='barcode';let intakeVideoData=null;

function sellerIntake(){
  scannedIMEI='';intakePhotos=[];intakeCondition='Отличное';intakeVideoData=null;
  document.getElementById('main').innerHTML=`
    <div class="section-label" style="margin-top:0;">📥 Приёмка телефона на склад</div>
    <div class="scan-mode-tabs">
      <div class="smt active" id="smt-barcode" onclick="setScanMode('barcode')">📷 Штрих-код IMEI</div>
      <div class="smt" id="smt-ocr" onclick="setScanMode('ocr')">🔢 С экрана</div>
    </div>
    <div class="scan-hint" id="scan-hint">Наведи камеру на штрих-код IMEI на коробке или под крышкой телефона</div>
    <div class="scanner-wrap"><div id="reader"></div><div class="scan-overlay"><div class="scan-frame"><div class="scan-line"></div></div></div></div>
    <div id="scan-result"></div>
    <div style="text-align:center;margin:10px 0;color:var(--gray);font-size:12px;">— или —</div>
    <div class="form-group"><input class="form-input" id="manual-imei" placeholder="Ввести IMEI вручную" inputmode="numeric" onchange="useManualIMEI()"></div>
    <div id="intake-form"></div>`;
  startScanner();
}
function setScanMode(mode){
  scanMode=mode;
  document.getElementById('smt-barcode').classList.toggle('active',mode==='barcode');
  document.getElementById('smt-ocr').classList.toggle('active',mode==='ocr');
  document.getElementById('scan-hint').textContent=mode==='barcode'?'Наведи камеру на штрих-код IMEI на коробке или под крышкой телефона':'Набери на телефоне *#06# — наведи камеру на штрих-код IMEI с экрана';
  stopScanner();setTimeout(startScanner,300);
}
function startScanner(){
  if(html5Scanner)return;
  if(!window.Html5Qrcode){document.getElementById('reader').innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--gray);font-size:13px;">📷 Открой на ТЕЛЕФОНЕ чтобы работала камера.<br>На компьютере — вводи IMEI вручную ниже 👇</div>';return;}
  html5Scanner=new Html5Qrcode("reader");
  html5Scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:120}},
    (text)=>{onScanSuccess(text);},()=>{}
  ).catch(()=>{document.getElementById('reader').innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--gray);font-size:13px;">📷 Разреши доступ к камере или вводи IMEI вручную 👇</div>';});
}
function stopScanner(){if(html5Scanner){try{html5Scanner.stop().then(()=>{html5Scanner.clear();html5Scanner=null;}).catch(()=>{html5Scanner=null;});}catch(e){html5Scanner=null;}}}
function onScanSuccess(text){
  const d=text.replace(/\D/g,'');
  if(d.length>=14&&d.length<=16){stopScanner();scannedIMEI=d.slice(0,15);showImeiFound(scannedIMEI);if(navigator.vibrate)navigator.vibrate(100);}
}
function useManualIMEI(){const v=document.getElementById('manual-imei').value.replace(/\D/g,'');if(v.length>=10){scannedIMEI=v;stopScanner();showImeiFound(v);}}
function showImeiFound(imei){
  const exists=DB.products.find(p=>p.imei===imei&&!p.sold);
  document.getElementById('scan-result').innerHTML=`<div class="scan-result-box"><div class="srb-label">✓ IMEI считан</div><div class="srb-imei">${imei}</div></div>`;
  if(exists){document.getElementById('intake-form').innerHTML=`<div style="background:#1A1408;border:1px solid #3A2E15;border-radius:12px;padding:14px;font-size:13px;color:var(--gold);">⚠️ Уже на складе: ${exists.model}</div>`;return;}
  renderIntakeForm(imei);
}
function renderIntakeForm(imei){
  document.getElementById('intake-form').innerHTML=`<div class="intake-section">
    <div class="intake-imei-display"><div class="ii-icon">📲</div><div><div class="ii-label">IMEI телефона</div><div class="ii-val">${imei}</div></div></div>
    <div class="form-group"><label class="form-label">Модель</label><input class="form-input" id="in-model" placeholder="iPhone 13" list="models-list">
      <datalist id="models-list"><option>iPhone 11</option><option>iPhone 12</option><option>iPhone 13</option><option>iPhone 13 Pro</option><option>iPhone 14</option><option>iPhone 14 Pro</option><option>iPhone 15</option><option>iPhone 15 Pro</option><option>Samsung Galaxy S23</option><option>Samsung Galaxy S24</option><option>Xiaomi 13</option><option>Redmi Note 13</option></datalist></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Память</label><select class="form-select" id="in-storage"><option>64GB</option><option>128GB</option><option selected>256GB</option><option>512GB</option><option>1TB</option></select></div>
      <div class="form-group"><label class="form-label">Цвет</label><input class="form-input" id="in-color" placeholder="Black"></div></div>
    <div class="form-group"><label class="form-label">Ёмкость батареи</label><div class="battery-display"><div class="battery-val" id="in-bat-val">90%</div><input type="range" min="50" max="100" value="90" id="in-battery" oninput="document.getElementById('in-bat-val').textContent=this.value+'%'"></div></div>
    <div class="form-group"><label class="form-label">Состояние</label><div class="cond-pills" id="cond-pills"><div class="cond-pill" onclick="setCond('Новый',this)">Новый</div><div class="cond-pill active" onclick="setCond('Отличное',this)">Отличное</div><div class="cond-pill" onclick="setCond('Хорошее',this)">Хорошее</div><div class="cond-pill" onclick="setCond('Удовлетв.',this)">Удовлетв.</div></div></div>
    <div class="form-group"><label class="form-label">Дефекты</label><textarea class="form-textarea" id="in-defects" placeholder="Царапина на корпусе, скол снизу..."></textarea></div>
    <div class="form-row"><div class="form-group"><label class="form-label">💸 Цена закупа</label><input class="form-input" id="in-buy" placeholder="70000" inputmode="numeric"></div>
      <div class="form-group"><label class="form-label">💰 Цена продажи</label><input class="form-input" id="in-sell" placeholder="87000" inputmode="numeric"></div></div>
    <div class="form-group"><label class="form-label">📸 Фото и видео</label><div class="photo-row">
      <label class="photo-btn"><input type="file" accept="image/*" capture="environment" multiple onchange="addIntakePhoto(this)"><div class="photo-icon">📸</div><div class="photo-label">Фото</div></label>
      <label class="photo-btn"><input type="file" accept="video/*" capture="environment" onchange="addIntakeVideo(this)"><div class="photo-icon">🎥</div><div class="photo-label">Видео</div></label></div>
      <div class="photo-preview" id="intake-photos"></div><div id="intake-video"></div></div>
    <button class="modal-btn primary" style="width:100%;margin-top:8px;" onclick="saveIntake('${imei}')">✅ Принять на склад</button></div>`;
}
function setCond(c,el){intakeCondition=c;document.querySelectorAll('#cond-pills .cond-pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');}
function addIntakePhoto(input){Array.from(input.files).forEach(file=>{if(intakePhotos.length>=8)return;const r=new FileReader();r.onload=e=>{intakePhotos.push(e.target.result);renderIntakePhotos();};r.readAsDataURL(file);});}
function renderIntakePhotos(){document.getElementById('intake-photos').innerHTML=intakePhotos.map((p,i)=>`<div class="photo-thumb" onclick="intakePhotos.splice(${i},1);renderIntakePhotos();"><img src="${p}"></div>`).join('');}
function addIntakeVideo(input){const f=input.files[0];if(!f)return;if(f.size>30*1024*1024){showToast('Видео больше 30MB',true);return;}const r=new FileReader();r.onload=e=>{intakeVideoData=e.target.result;document.getElementById('intake-video').innerHTML=`<video src="${e.target.result}" controls style="width:100%;border-radius:10px;margin-top:8px;"></video>`;};r.readAsDataURL(f);}
async function saveIntake(imei){
  const model=document.getElementById('in-model').value.trim();
  const sell=parseInt(document.getElementById('in-sell').value)||0;
  const buy=parseInt(document.getElementById('in-buy').value)||0;
  if(!model){showToast('⚠️ Укажи модель',true);return;}
  if(!sell){showToast('⚠️ Укажи цену продажи',true);return;}
  let brand='Другое';const ml=model.toLowerCase();
  if(ml.includes('iphone'))brand='iPhone';else if(ml.includes('samsung'))brand='Samsung';else if(ml.includes('xiaomi')||ml.includes('redmi'))brand='Xiaomi';
  const np={id:'LP'+Date.now(),point:currentUser.point,model,brand,storage:document.getElementById('in-storage').value,color:document.getElementById('in-color').value||'—',imei,buy_price:buy,sell_price:sell,battery:parseInt(document.getElementById('in-battery').value),condition:intakeCondition,isNew:intakeCondition==='Новый',defects:document.getElementById('in-defects').value||'',photos:intakePhotos,video:intakeVideoData,sold:false,created_at:new Date().toISOString()};
  DB.products.push(np);
  if(cloudMode&&sb){
    try{
      const r=await sb.from('products').insert([{...np,photos:undefined,video:undefined}]);
      if(r.error){showToast('❌ Ошибка облака: '+r.error.message,true);console.error('INSERT ERROR:',r.error);}
      else{showToast('☁️ Телефон сохранён в облако ✅');}
    }catch(e){showToast('❌ Ошибка: '+e.message,true);console.error('INSERT CATCH:',e);}
  } else {
    showToast('⚠️ Облако: cloudMode='+cloudMode+' sb='+(sb?'ok':'null'),true);
  }
  saveLocal();
  showToast('✅ '+model+' принят на склад!');
  if(navigator.vibrate)navigator.vibrate([50,30,50]);
  sellerIntake();
}

let cart=[]; // корзина для продажи нескольких телефонов
function sellerStock(){renderFullStock('seller');if(cloudMode&&sb){loadFromCloud().then(()=>renderStockList());}}

  const main=document.getElementById('main');
  const stock=DB.products.filter(p=>p.sold!==true);
  main.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <div class="search-bar" style="flex:1;margin-bottom:0;"><span>🔍</span><input id="stock-search" placeholder="Поиск по модели или IMEI" oninput="filterStock()"></div>
      <button onclick="refreshStock('${mode}')" style="background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:0 14px;color:var(--accent);font-size:18px;cursor:pointer;">🔄</button>
    </div>
    <div class="filter-pills" id="stock-pills">
      <div class="pill active" onclick="setStockFilter('all',this)">Все (${stock.length})</div>

function setStockFilter(f,el){stockFilter=f;document.querySelectorAll('#stock-pills .pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');renderStockList();}
function filterStock(){renderStockList();}

async function refreshStock(mode){
  if(!cloudMode||!sb){showToast('Облако не подключено');return;}
  showToast('🔄 Обновляю...');
  await loadFromCloud();
  renderFullStock(mode||'seller');
  showToast('✅ Склад обновлён');
}

function renderStockList(){
  const q=(document.getElementById('stock-search')?.value||'').toLowerCase();
  let items=DB.products.filter(p=>p.sold!==true);
  if(stockFilter==='new')items=items.filter(p=>p.isNew);
  else if(stockFilter==='used')items=items.filter(p=>!p.isNew);
  else if(stockFilter!=='all')items=items.filter(p=>p.point===stockFilter);
  if(q)items=items.filter(p=>p.model.toLowerCase().includes(q)||p.imei.includes(q));
  const list=document.getElementById('stock-list');
  if(items.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">Ничего не найдено</div></div>';return;}
  const pn=(pid)=>POINTS.find(p=>p.id===pid)?.name||pid;
  list.innerHTML=items.map(p=>{
    const isMine=currentUser.role==='seller'&&p.point===currentUser.point;
    return `<div class="prod-item" onclick="openProduct('${p.id}')">
      <div class="prod-thumb">${p.isNew?'✨':'📱'}</div>
      <div class="prod-info"><div class="prod-name">${p.model} ${p.storage}${p.isNew?' <span style=\"font-size:9px;background:var(--accent);color:#000;padding:1px 6px;border-radius:10px;font-weight:700;\">NEW</span>':''}</div><div class="prod-meta">🔋${p.battery}% · ${p.condition}</div><div class="prod-point">📍 ${pn(p.point)}${isMine?' · моя точка':''}</div></div>
      <div class="prod-right"><div class="prod-price">${fmt(p.sell_price)}</div><div class="prod-stock ${isMine?'mine':'in'}">${isMine?'моя точка':'доступен'}</div></div>
    </div>`;
  }).join('');
}

  const isMine=p.point===currentUser.point;
  const canSell=currentUser.role==='seller'; // любой продавец может продать любой телефон
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">${p.model} ${p.storage}</div>
    <div class="modal-sub">${p.color} · 📍 ${pn(p.point)}${isMine?' · моя точка':''}</div>
    <div class="detail-rows">
      <div class="detail-row"><div class="detail-key">IMEI</div><div class="detail-val">${p.imei}</div></div>
      <div class="detail-row"><div class="detail-key">Батарея</div><div class="detail-val green">${p.battery}%</div></div>
      <div class="detail-row"><div class="detail-key">Состояние</div><div class="detail-val">${p.condition}</div></div>
      ${p.defects?`<div class="detail-row"><div class="detail-key">Дефекты</div><div class="detail-val" style="color:var(--orange);font-size:11px;text-align:right;max-width:60%;">${p.defects}</div></div>`:''}
      <div class="detail-row"><div class="detail-key">💸 Себестоимость</div><div class="detail-val">${fmt(p.buy_price)}</div></div>
      <div class="detail-row"><div class="detail-key">💰 Цена продажи</div><div class="detail-val accent">${fmt(p.sell_price)}</div></div>
      <div class="detail-row"><div class="detail-key">📈 Маржа</div><div class="detail-val green">+${fmt(p.sell_price-p.buy_price)} (${p.buy_price?Math.round((p.sell_price-p.buy_price)/p.buy_price*100):0}%)</div></div>
    </div>
    ${(p.photos&&p.photos.length)||p.video?`<div class="section-label">Фото и видео</div>${p.photos&&p.photos.length?`<div class="photo-preview">${p.photos.map(ph=>`<div class="photo-thumb" onclick="window.open('${ph}')"><img src="${ph}"></div>`).join('')}</div>`:''}${p.video?`<video src="${p.video}" controls style="width:100%;border-radius:10px;margin-top:8px;"></video>`:''}`:''}
    ${!isMine&&currentUser.role==='seller'?`<div style="background:#1A1408;border:1px solid #3A2E15;border-radius:10px;padding:10px;margin-top:14px;font-size:12px;color:var(--gold);text-align:center;">📍 Телефон на точке "${pn(p.point).split('·')[0].trim()}" — забери оттуда или договорись о переносе</div>`:''}
    ${canSell?`<div class="modal-actions"><button class="modal-btn primary" onclick="sellPhone('${p.id}')">💰 Продать сразу</button><button class="modal-btn" style="background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue);" onclick="addToCart('${p.id}')">🛒 В корзину</button></div><button class="modal-btn secondary" style="width:100%;margin-top:8px;" onclick="closeModal()">Закрыть</button>`:
      `<div class="modal-actions"><button class="modal-btn primary" onclick="sellPhone('${p.id}')">💰 Продать</button><button class="modal-btn" style="background:#3B82F620;color:var(--blue);border:1px solid var(--blue);" onclick="editPriceAdmin('${p.id}')">✏️ Цены</button><button class="modal-btn" style="background:var(--red-dim);color:var(--red);border:1px solid var(--red);" onclick="deleteProductAdmin('${p.id}')">🗑</button></div><button class="modal-btn secondary" style="width:100%;margin-top:8px;" onclick="closeModal()">Закрыть</button>`}`;
  document.getElementById('modal').classList.add('open');

// Удаление телефона админом
function deleteProductAdmin(id){
  const p=DB.products.find(x=>x.id===id);if(!p)return;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">🗑 Удалить телефон?</div>
    <div class="modal-sub">${p.model} ${p.storage} · ${fmt(p.sell_price)}</div>
    <div style="background:#1A0D0D;border:1px solid #3A1A1A;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--gray);line-height:1.6;">

    </div>
    <div class="modal-actions">

async function confirmDelete(id){
  DB.products=DB.products.filter(p=>p.id!==id);
  saveLocal();
  if(cloudMode&&sb){try{await sb.from('products').delete().eq('id',id);}catch(e){}}
  closeModal();
  showToast('🗑 Телефон удалён со склада');
  // Перерисовываем склад в зависимости от роли
  if(currentUser.role==='admin'){adminStock();}
  else{sellerStock();}
}

function updMargin(){
  const b=parseInt(document.getElementById('ep-buy').value)||0;
  const s=parseInt(document.getElementById('ep-sell').value)||0;

function addToCart(id){
  const p=DB.products.find(x=>x.id===id);
  if(!p||p.sold)return;
  if(cart.find(c=>c.id===id)){showToast('Уже в корзине');return;}

}

function updateCartFab(){
  let fab=document.getElementById('cart-fab');
  if(cart.length===0){if(fab)fab.remove();return;}
  if(!fab){
    fab=document.createElement('button');
    fab.id='cart-fab';fab.className='cart-fab';
    fab.onclick=openCart;
    document.body.appendChild(fab);
  }
  fab.innerHTML='🛒<span class="cart-fab-badge">'+cart.length+'</span>';
}

function openCart(){

  document.getElementById('modal-body').innerHTML=`

async function cartFinish(payment){
  const clientName=document.getElementById('cl-name')?.value.trim()||'—';
  const clientPhone=document.getElementById('cl-phone')?.value.trim()||'';
  const soldItems=[...cart];
  const total=cart.reduce((s,p)=>s+p.sell_price,0);
  // Оформляем каждый телефон
  for(const p of cart){
    p.sold=true;
    const sale={id:'S'+Date.now()+Math.random().toString(36).slice(2,5),point:currentUser.point||p.point,seller:currentUser.name,model:p.model+' '+p.storage,sell_price:p.sell_price,buy_price:p.buy_price,payment,created_at:new Date().toISOString(),client_name:clientName,client_phone:clientPhone,warranty_days:30,imei:p.imei,battery:p.battery,condition:p.condition,passport_id:p.id};

  const d=window._multiDoc;if(!d)return;
  const text=`🛡 *LA PHONE — ДОГОВОР И ГАРАНТИЯ*\nДокумент № ${d.docNum}\n━━━━━━━━━━━━━━━━━━━\n\n*${d.items.length} ТЕЛЕФОНОВ:*\n${d.items.map((p,i)=>`${i+1}. ${p.model} ${p.storage}\n   IMEI: ${p.imei}\n   Батарея: ${p.battery}% · ${fmt(p.sell_price)}`).join('\n\n')}\n\n━━━━━━━━━━━━━━━━━━━\n*Итого: ${fmt(d.sale.total)}*\nОплата: ${d.sale.payment}\nПокупатель: ${d.sale.clientName}\nПродавец: La Phone · ${d.pointName}\n\n🛡 Гарантия 30 дней до ${d.end}\n\nLa Phone · Астана\nСпасибо за покупку! 🤝`;
  const phone=d.sale.clientPhone.replace(/\D/g,'');
  const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(text)}`:`https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url,'_blank');
  showToast('📱 Отправляю клиенту...');
}

      <button class="modal-btn primary" onclick="finishSale('${id}','${payment}')">✅ Оформить и создать документ</button>
      <button class="modal-btn secondary" onclick="sellPhone('${id}')">Назад</button>
    </div>`;
}

async function finishSale(id,payment){
  const p=DB.products.find(x=>x.id===id);
  const clientName=document.getElementById('cl-name')?.value.trim()||'—';
  const clientPhone=document.getElementById('cl-phone')?.value.trim()||'';
  const warrantyDays=30; // гарантия всегда месяц
  const saleData={clientName,clientPhone,warrantyDays,payment,date:new Date()};
  // Данные рассрочки
  if(payment==='Рассрочка'){saleData.instTerm=window._instTerm;saleData.instMonthly=window._instMonthly;saleData.instTotal=window._instTotal;}
  // Данные обмена
  if(payment==='Обмен'){saleData.tradeModel=window._tradeModel||'';saleData.tradeImei=window._tradeImei||'';saleData.tradeValue=window._tradeValue||0;saleData.doplata=p.sell_price-(window._tradeValue||0);}
  await cloudSell(p,payment);
  const lastSale=DB.sales[DB.sales.length-1];
  if(lastSale){
    lastSale.client_name=clientName;lastSale.client_phone=clientPhone;lastSale.warranty_days=warrantyDays;
    lastSale.imei=p.imei;lastSale.battery=p.battery;lastSale.condition=p.condition;lastSale.passport_id=p.id;
    if(payment==='Рассрочка'){lastSale.inst_term=window._instTerm;lastSale.inst_total=window._instTotal;}
    if(payment==='Обмен'){lastSale.trade_model=saleData.tradeModel;lastSale.trade_value=saleData.tradeValue;lastSale.doplata=saleData.doplata;}
  }
  // Обмен: старый телефон на склад
  if(payment==='Обмен' && saleData.tradeModel){
    DB.products.push({id:'LP'+Date.now(),point:currentUser.point,model:saleData.tradeModel,brand:'Trade-in',storage:'',color:'—',imei:saleData.tradeImei||'',buy_price:saleData.tradeValue,sell_price:Math.round(saleData.tradeValue*1.3),battery:85,condition:'Б/у (трейд-ин)',sold:false,created_at:new Date().toISOString()});
  }
  saveLocal();
  closeModal();
  showWarrantyDoc(p, saleData);
  if(navigator.vibrate)navigator.vibrate([50,30,50]);
}

// Генерация настоящего PDF документа
function sharePDF(){
  const d=window._warrantyData;
  if(!d){showToast('Нет данных',true);return;}
  if(!window.jspdf){showToast('PDF доступен на телефоне/после публикации',true);return;}
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'mm',format:'a5'});
    let y=18;
    doc.setFontSize(22);doc.setTextColor(20,20,20);
    doc.text('La Phone',15,y);
    doc.setFontSize(9);doc.setTextColor(120,120,120);
    doc.text('Dogovor · Garantiya · Pasport',15,y+6);
    doc.text('Dok. # '+d.docNum+'  '+d.start,15,y+11);
    y+=22;
    doc.setDrawColor(200,200,200);doc.line(15,y,125,y);y+=8;
    doc.setFontSize(14);doc.setTextColor(20,20,20);
    doc.text(d.model+' '+d.storage,15,y);y+=6;
    doc.setFontSize(10);doc.setTextColor(90,90,90);
    doc.text(d.color+' · '+d.condition,15,y);y+=10;
    const row=(k,v)=>{doc.setTextColor(120,120,120);doc.text(k,15,y);doc.setTextColor(20,20,20);doc.text(String(v),125,y,{align:'right'});y+=6;};
    doc.setFontSize(10);
    row('IMEI:',d.imei);
    row('Batareya:',d.battery+'%');
    row('Sostoyanie:',d.condition);
    y+=2;doc.line(15,y,125,y);y+=8;
    row('Tsena:',d.price);
    row('Oplata:',d.payment.length>22?d.payment.slice(0,22):d.payment);
    row('Prodavets:','La Phone '+d.point);
    row('Pokupatel:',d.name);
    if(d.phone)row('Telefon:',d.phone);
    y+=2;doc.line(15,y,125,y);y+=8;
    row('Data prodazhi:',d.start);
    row('Garantiya:','30 dney (1 mesyats)');
    row('Deystvuet do:',d.end);
    y+=10;doc.setFontSize(8);doc.setTextColor(150,150,150);
    doc.text('La Phone · Astana · Spasibo za pokupku!',15,y);
    const filename='LaPhone_'+d.docNum+'.pdf';
    // Попытка поделиться через системное меню (там есть WhatsApp)
    if(navigator.share && navigator.canShare){
      const blob=doc.output('blob');
      const file=new File([blob],filename,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'La Phone — документ'}).then(()=>showToast('📄 Отправлено')).catch(()=>doc.save(filename));
        return;
      }
    }
    doc.save(filename);
    showToast('📄 PDF скачан');
  }catch(e){showToast('PDF: открой на телефоне',true);}
}

function sellerReturns(){if(cloudMode&&sb){loadFromCloud();}
  const allSold=DB.sales.filter(x=>x.passport_id && !x.returned);
  const returns=DB.sales.filter(x=>x.returned);
  document.getElementById('main').innerHTML=`
    <div class="section-label" style="margin-top:2px;">↩️ Возврат телефона по гарантии</div>
    <div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--gray);line-height:1.6;">
      Если телефон неисправен в течение гарантии (30 дней) — найди продажу и оформи возврат. Телефон вернётся на склад, выручка пересчитается.
    </div>
    <div class="search-bar"><span>🔍</span><input id="ret-search" placeholder="Поиск по IMEI, клиенту или модели" oninput="filterReturns()"></div>
    <div class="section-label">Проданные телефоны</div>
    <div id="returns-list">${renderReturnsList(allSold)}</div>
    ${returns.length?`<div class="section-label">↩️ Уже возвращено (${returns.length})</div>${returns.slice().reverse().map(x=>`<div class="prod-item" style="opacity:0.55;"><div class="prod-thumb">↩️</div><div class="prod-info"><div class="prod-name">${x.model}</div><div class="prod-meta" style="color:var(--red);">${x.return_reason||'Возврат'} · ${x.client_name||''}</div></div><div class="prod-right"><div class="prod-price" style="color:var(--red);">−${fmt(x.sell_price)}</div></div></div>`).join('')}`:''}
  `;
}

function renderReturnsList(items){
  if(items.length===0)return '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Нет проданных телефонов<br>для возврата</div></div>';
  return items.slice().reverse().map(x=>{
    const si=DB.sales.indexOf(x);
    return `<div class="prod-item" onclick="returnSale(${si})">
      <div class="prod-thumb">📱</div>
      <div class="prod-info"><div class="prod-name">${x.model}</div><div class="prod-meta">${x.client_name||'клиент'} · ${x.payment}</div><div class="prod-point">IMEI ...${(x.imei||'').slice(-6)} · ${new Date(x.created_at).toLocaleDateString('ru-RU')}</div></div>
      <div class="prod-right"><div class="prod-price">${fmt(x.sell_price)}</div><div class="prod-stock" style="background:var(--red-dim);color:var(--red);">↩️ вернуть</div></div>
    </div>`;
  }).join('');
}

function filterReturns(){
  const q=(document.getElementById('ret-search').value||'').toLowerCase();
  const all=DB.sales.filter(x=>x.passport_id && !x.returned);
  const f=all.filter(x=>(x.imei||'').includes(q)||(x.client_name||'').toLowerCase().includes(q)||(x.model||'').toLowerCase().includes(q));
  document.getElementById('returns-list').innerHTML=renderReturnsList(f);
}

function returnSale(idx){
  const s=DB.sales[idx];
  if(!s)return;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">↩️ Возврат по гарантии</div>
    <div class="modal-sub">${s.model} · ${fmt(s.sell_price)}</div>
    <div style="background:#1A0D0D;border:1px solid #3A1A1A;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--gray);line-height:1.6;">
      Клиент: <b style="color:var(--white);">${s.client_name||'не указан'}</b><br>
      IMEI: ${s.imei||'—'}<br>
      Оплата была: ${s.payment}
    </div>
    <div class="form-group"><label class="form-label">Причина возврата</label>
      <select class="form-select" id="ret-reason">
        <option>Неисправность по гарантии</option>
        <option>Брак экрана</option>
        <option>Проблема с батареей</option>
        <option>Не включается</option>
        <option>Передумал клиент</option>
        <option>Другое</option>
      </select>
    </div>
    <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px;color:var(--gray);">
      После возврата:<br>
      • Телефон вернётся на склад<br>
      • Выручка уменьшится на ${fmt(s.sell_price)}<br>
      • ${s.payment==='Наличные'?'Вернуть клиенту нал из кассы':'Вернуть на Kaspi / отменить рассрочку'}
    </div>
    <div class="modal-actions">
      <button class="modal-btn" style="background:var(--red);color:#fff;" onclick="confirmReturn(${idx})">↩️ Подтвердить возврат</button>
      <button class="modal-btn secondary" onclick="closeModal()">Отмена</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}

async function confirmReturn(idx){
  const s=DB.sales[idx];
  if(!s)return;
  const reason=document.getElementById('ret-reason')?.value||'Возврат';
  // Возвращаем телефон на склад
  const existing=DB.products.find(p=>p.id===s.passport_id);
  if(existing){existing.sold=false;}
  else{
    DB.products.push({id:s.passport_id||'LP'+Date.now(),point:s.point,model:s.model.replace(/\s+(128GB|256GB|512GB|64GB|1TB)/g,'').trim(),storage:'',color:'—',imei:s.imei||'',buy_price:s.buy_price,sell_price:s.sell_price,battery:s.battery||85,condition:s.condition||'Б/у',isNew:false,sold:false,created_at:new Date().toISOString()});
  }
  // Помечаем продажу возвращённой
  s.returned=true;s.return_reason=reason;s.return_date=new Date().toISOString();
  saveLocal();
  if(cloudMode&&sb){
    try{
      await sb.from('sales').update({returned:true,return_reason:reason,return_date:s.return_date}).eq('id',s.id);
      if(s.passport_id)await sb.from('products').update({sold:false}).eq('id',s.passport_id);
    }catch(e){}
  }
  closeModal();
  showToast('↩️ Возврат оформлен · −'+fmt(s.sell_price));
  if(currentUser.role==='seller'&&typeof sellerReturns==='function'){sellerReturns();}
  if(navigator.vibrate)navigator.vibrate(100);
}
